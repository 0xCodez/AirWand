name: Desktop

# Builds and tests the Rust desktop agent (desktop/) on macOS and Windows.
# Linux is intentionally not used: the tray / input-injection dependencies
# need system libraries that are not part of the v0.1 target platforms.
#
# On a tag push (v*), the built artifacts are also attached to the GitHub
# Release for that tag (see the "release" job). There is no separate
# release.yml; see CONTRIBUTING.md -> "Releasing".

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create/update a GitHub Release with this tag (e.g. v0.1.0). Empty = build only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  macos:
    name: macOS (universal)
    # Dependabot PRs skip the scarce macOS runners; Linux/Windows jobs still check them.
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable, both Apple targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt, clippy

      - name: Make sure both Apple targets are installed
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Non-blocking for v0.1; will become a hard gate later.
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Bundle universal AirWand.app (ad-hoc signed)
        run: bash scripts/bundle-macos.sh

      - name: Zip AirWand.app
        run: |
          test -d dist/AirWand.app
          ditto -c -k --sequesterRsrc --keepParent dist/AirWand.app dist/AirWand-macos-universal.zip
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: airwand-macos
          path: desktop/dist/AirWand-macos-universal.zip
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: cargo fmt --check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Non-blocking for v0.1; will become a hard gate later.
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release

      - name: Collect airwand.exe
        run: |
          mkdir -p dist
          cp target/release/airwand.exe dist/airwand-windows-x64.exe
          cp scripts/firewall-windows.ps1 dist/firewall-windows.ps1
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: airwand-windows
          path: |
            desktop/dist/airwand-windows-x64.exe
            desktop/dist/firewall-windows.ps1
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AirWand ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/AirWand-macos-universal.zip
            release-assets/airwand-windows-x64.exe
            release-assets/firewall-windows.ps1
          fail_on_unmatched_files: true
          generate_release_notes: true
