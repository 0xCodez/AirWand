name: Mobile

# Builds and tests the Flutter phone app (mobile/).
# Platform folders (android/, ios/) are NOT committed; they are generated by
# `bash tool/bootstrap.sh` before every build.
#
# On a tag push (v*), the APK and the unsigned IPA are also attached to the
# GitHub Release for that tag (see the "release" job). There is no separate
# release.yml; see CONTRIBUTING.md -> "Releasing".

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create/update a GitHub Release with this tag (e.g. v0.1.0). Empty = build only."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: bash tool/bootstrap.sh

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test
        run: |
          if [ -d test ]; then
            flutter test
          else
            echo "No test/ directory, skipping."
          fi

      - name: flutter build apk --release
        # v0.1: the release APK is signed with the Flutter-generated DEBUG key.
        # It installs and runs fine for sideloading, but it is not suitable for
        # Google Play. A real upload key will be wired in via repository
        # secrets before store releases (see docs/ROADMAP.md).
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/airwand-android.apk
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: airwand-android
          path: mobile/dist/airwand-android.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (unsigned IPA)
    # Dependabot PRs skip the scarce macOS runners; Linux/Windows jobs still check them.
    if: github.actor != 'dependabot[bot]'
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate platform folders
        run: bash tool/bootstrap.sh

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build ios --release --no-codesign
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        # An .ipa is just a zip with Payload/Runner.app inside. It is unsigned:
        # users re-sign it with their own Apple ID (AltStore, Sideloadly, ...).
        run: |
          test -d build/ios/iphoneos/Runner.app
          rm -rf dist Payload
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/airwand-ios-unsigned.ipa Payload
          rm -rf Payload
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: airwand-ios
          path: mobile/dist/airwand-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -la release-assets

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AirWand ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-assets/airwand-android.apk
            release-assets/airwand-ios-unsigned.ipa
          fail_on_unmatched_files: true
          generate_release_notes: true
