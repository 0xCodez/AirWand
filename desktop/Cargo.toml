[package]
name = "orbit-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Orbit host agent: turns a paired phone into a trackpad, air pointer, keyboard and media remote for macOS and Windows."
license = "MIT"
publish = false

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.86"
log = "0.4.22"
env_logger = "0.11.5"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
base64 = "0.22.1"
hex = "0.4.3"
# Crypto (PROTOCOL.md section 2 and 3)
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
hkdf = "0.12.4"
sha2 = "0.10.8"
chacha20poly1305 = "0.10.1"
# Discovery
mdns-sd = "0.11.5"
# Input injection (buttons, keys on Windows, text, media keys)
enigo = "0.2.1"
# Tray / menu bar icon and the main-thread event loop
tray-icon = "0.19.2"
tao = "0.30.8"
# Config location and default host name
dirs = "5.0.1"
gethostname = "0.5.0"

[target.'cfg(target_os = "macos")'.dependencies]
# "highsierra" enables CGEvent::new_scroll_event (pixel scrolling)
core-graphics = { version = "0.23.2", features = ["highsierra"] }
core-foundation = "0.9.4"
rfd = "0.14.1"
# [NSApp activateIgnoringOtherApps:] before the pairing alert (menu-bar apps are never
# frontmost, so the NSAlert would otherwise open behind other windows). Already in the
# dependency tree through rfd / tao.
objc = "0.2.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
